<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwiftCart | Faster checkout prototype</title>
  <meta name="description" content="Prototype of the upgraded SwiftCart storefront: saved carts, transparent pricing and a three-step guest checkout.">
  <meta name="theme-color" content="#F6F5F2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315171B'/%3E%3Cpath d='M17.5 6 9 17.5h6L13.5 26 23 14.5h-6L17.5 6Z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="announce">
    <div class="container announce__inner">
      <span>Free delivery on orders above &#8377;999</span><i></i>
      <span>Easy 7-day returns</span><i></i>
      <span>Guest checkout, no account needed</span>
    </div>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="container site-header__inner">
      <a class="brand" href="#/" aria-label="SwiftCart home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M13 2 4.5 13.5h6L9 22l9.5-11.5h-6L13 2Z"/></svg>
        </span>
        <span>SwiftCart</span>
      </a>

      <label class="search">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="Search products" autocomplete="off" aria-label="Search products">
        <kbd aria-hidden="true">/</kbd>
      </label>

      <span class="secure-label">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        Secure checkout
      </span>

      <a class="cart-btn orders-btn" id="ordersBtn" href="#/orders" aria-label="My orders">
        <svg class="icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 7.5 8.5-4 8.5 4v9l-8.5 4-8.5-4v-9Z"/><path d="m3.5 7.5 8.5 4 8.5-4M12 11.5v9"/></svg>
        <span class="cart-btn__text">Orders</span>
      </a>

      <button type="button" class="cart-btn" id="cartBtn" data-action="open-cart" aria-label="Open cart">
        <svg class="icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-btn__text">Cart</span>
        <span class="cart-btn__count" id="cartCount" hidden>0</span>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>&copy; 2026 SwiftCart. A software engineering PBL prototype.</span>
      <span>Prices include GST &middot; Payments are simulated</span>
    </div>
  </footer>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle" aria-hidden="true" inert></aside>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;text-align:center">SwiftCart needs JavaScript to run. Please enable it and reload.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
